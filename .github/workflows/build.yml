name: Build J2ME MIDlet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build the MIDlet suite
        run: mvn -B package

      - name: Upload Toolkit.jar and Toolkit.jad
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-j2me-build
          path: |
            target/j2me/Toolkit.jar
            target/j2me/Toolkit.jad
